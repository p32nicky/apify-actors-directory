name: ElevenLabs Voice AI Poster

on:
  schedule:
    - cron: '0 13 * * *'  # 9 AM ET
    - cron: '0 16 * * *'  # 12 PM ET
    - cron: '0 19 * * *'  # 3 PM ET
    - cron: '0 22 * * *'  # 6 PM ET
    - cron: '0 1 * * *'   # 9 PM ET
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore poster state
        uses: actions/cache@v4
        with:
          path: .devto-elevenlabs-state.json
          key: elevenlabs-poster-state-${{ github.run_number }}
          restore-keys: |
            elevenlabs-poster-state-

      - name: Publish ElevenLabs articles
        env:
          DEVTO_ELEVENLABS_KEY: ${{ secrets.DEVTO_ELEVENLABS_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node devto-elevenlabs-poster.js --count=2

