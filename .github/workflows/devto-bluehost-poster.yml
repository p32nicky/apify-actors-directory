name: Bluehost Web Hosting Poster

on:
  schedule:
    - cron: '0 12 * * *'  # 8 AM ET
    - cron: '0 15 * * *'  # 11 AM ET
    - cron: '0 18 * * *'  # 2 PM ET
    - cron: '0 21 * * *'  # 5 PM ET
    - cron: '0 0 * * *'   # 8 PM ET
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore poster state
        uses: actions/cache@v4
        with:
          path: .devto-bluehost-state.json
          key: bluehost-poster-state-${{ github.run_number }}
          restore-keys: |
            bluehost-poster-state-

      - name: Publish Bluehost article
        env:
          DEVTO_BLUEHOST_KEY: ${{ secrets.DEVTO_BLUEHOST_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node devto-bluehost-poster.js --count=1
